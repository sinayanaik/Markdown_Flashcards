<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flashcards</title>
    <link rel="icon" type="image/png" href="fevicon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="vendor/bulma.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="styles.css?v=20260520-30">
  </head>
  <body>
    <main class="app-shell">
      <header class="appbar">
        <div class="deck-meta">
          <span class="deck-title" id="deckTitle" hidden></span>
          <span id="positionText">Card 0 of 0</span>
          <strong id="scoreText">Known 0 / Review 0</strong>
          <span id="cardCount">0 cards</span>
        </div>

        <div class="toolbar">
          <button class="tool-button button is-small" id="importBtn" type="button">Import</button>
          <div class="menu-wrap">
            <button class="tool-button button is-small" id="exportBtn" type="button">Export</button>
            <div class="export-menu" id="exportMenu" hidden>
              <button type="button" data-export="pdf" data-scope="known">Known PDF</button>
              <button type="button" data-export="pdf" data-scope="review">Review PDF</button>
              <button type="button" data-export="pdf" data-scope="all">All PDF</button>
              <button type="button" data-export="markdown" data-scope="all">All Markdown</button>
              <button type="button" data-export="json" data-scope="all">All JSON</button>
            </div>
          </div>
          <button class="tool-button button is-small" id="allCardsBtn" type="button">All</button>
          <button class="tool-button button is-small" id="themeBtn" type="button">Dark</button>
          <button class="icon-button button is-small" id="shuffleBtn" type="button" title="Shuffle" aria-label="Shuffle cards">
            <span aria-hidden="true">&#8644;</span>
          </button>
          <button class="icon-button button is-small" id="resetBtn" type="button" title="Restart" aria-label="Restart quiz">
            <span aria-hidden="true">&#8635;</span>
          </button>
        </div>
      </header>

      <section class="study-layout" aria-label="Flashcard study area">
        <aside class="result-panel review-panel" aria-label="Review cards">
          <div class="result-head">
            <div>
              <span class="result-label">&#8592; Review</span>
              <strong id="reviewStackCount">0</strong>
            </div>
          </div>
          <div class="brick-list" id="reviewBrickList"></div>
        </aside>

        <section class="quiz-panel" aria-label="Flashcard quiz">
          <div class="progress-track" aria-hidden="true">
            <span id="progressBar"></span>
          </div>

          <div class="deck" id="deck">
            <article class="card" id="card" tabindex="0" aria-label="Current quiz card">
              <div class="card-face card-question">
                <span class="face-label">Question</span>
                <div class="rendered" id="questionView"></div>
              </div>
              <div class="card-face card-answer">
                <span class="face-label">Answer</span>
                <div class="rendered" id="answerView"></div>
              </div>
            </article>
          </div>

          <div class="controls" aria-label="Card actions">
            <button class="review" id="reviewBtn" type="button" title="Review" aria-label="Mark card for review"><span aria-hidden="true">❌</span><span>Review</span></button>
            <button class="nav-card" id="prevCardBtn" type="button" title="Previous card" aria-label="Previous card"><span aria-hidden="true">&#8593;</span><span>Prev</span></button>
            <button class="nav-card" id="nextCardBtn" type="button" title="Next card" aria-label="Next card"><span aria-hidden="true">&#8595;</span><span>Next</span></button>
            <button class="known" id="knownBtn" type="button" title="Known" aria-label="Mark card known"><span>Known</span><span aria-hidden="true">✅</span></button>
          </div>
          <div class="replay-actions" aria-label="Replay options">
            <button id="replayAllBtn" type="button">All cards</button>
            <button id="replayReviewBtn" type="button">Review only</button>
            <button id="replayKnownBtn" type="button">Known only</button>
          </div>
        </section>

        <aside class="result-panel known-panel" aria-label="Known cards">
          <div class="result-head">
            <div>
              <span class="result-label">Known &#8594;</span>
              <strong id="knownStackCount">0</strong>
            </div>
          </div>
          <div class="brick-list" id="knownBrickList"></div>
        </aside>
      </section>
    </main>

    <section class="import-panel is-open" id="importPanel" aria-label="Import notes">
      <div class="import-card">
        <div class="import-head">
          <div>
            <h1>Import notes</h1>
            <p>Use an exported Notion zip, Markdown file, pasted Markdown, or a public raw Markdown URL.</p>
          </div>
          <button class="icon-button" id="closeImportBtn" type="button" aria-label="Close import panel">&#215;</button>
        </div>

        <label class="file-pick">
          <input id="fileInput" type="file" accept=".md,.markdown,.txt,.json,.zip,text/markdown,text/plain,application/json,application/zip,application/x-zip-compressed">
          <span>Open Markdown, JSON, or zip</span>
        </label>

        <label class="field">
          <span>URL</span>
          <div class="url-row">
            <input id="urlInput" type="url" placeholder="https://..." autocomplete="off">
            <button id="fetchBtn" type="button">Fetch</button>
          </div>
        </label>

        <label class="field">
          <span>Markdown</span>
          <textarea id="sourceInput" spellcheck="false" placeholder="### Question?&#10;&#10;Answer..."></textarea>
        </label>

        <div class="import-actions">
          <button id="parseBtn" type="button">Build deck</button>
          <button id="sampleBtn" type="button" hidden>Load sample</button>
        </div>

        <p class="status" id="statusText" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="print-root" id="printRoot" aria-hidden="true"></section>

    <section class="all-cards-panel" id="allCardsPanel" hidden aria-label="All cards">
      <div class="all-cards-shell">
        <div class="all-cards-head">
          <div>
            <h1>All cards</h1>
            <p id="allCardsSummary">0 cards</p>
          </div>
          <button class="icon-button" id="closeAllCardsBtn" type="button" aria-label="Close all cards">&#215;</button>
        </div>
        <div class="all-cards-list" id="allCardsList"></div>
      </div>
    </section>

    <section class="diagram-modal" id="diagramModal" hidden aria-label="Diagram preview">
      <div class="diagram-modal-head">
        <span>Diagram</span>
        <button class="icon-button" id="closeDiagramBtn" type="button" aria-label="Close diagram preview">&#215;</button>
      </div>
      <div class="diagram-modal-body" id="diagramModalBody"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="app.js?v=20260520-28"></script>
  </body>
</html>
